  ↓filterData [steps.SimpleStep-1778170634422]: 
    expression: |
      'var permissions = [];
      //log.warn("###### userPermissions.getLength(): "+ userPermissions.getLength());
      for (var i=0; i<userPermissions.getLength(); i++) {
      	var permission = "" + userPermissions.item(i).getTextContent();
      	//log.warn("###### permission: "+ permission);
      	permissions.push(permission);
      }
      
      var fileredData = [];
      if (permissions.includes("samplerbac.data.read:all")) {
      	fileredData = data;
      } else if (permissions.includes("samplerbac.data.read:own")) {
      	fileredData = data.filter(ob => (ob.uid == authenticatedUID));
      }'
