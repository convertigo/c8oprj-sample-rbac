  ↓checkAndDelete [steps.SimpleStep-1778494310679]: 
    expression: |
      'var permissions = [];
      //log.warn("###### userPermissions.getLength(): "+ userPermissions.getLength());
      for (var i=0; i<userPermissions.getLength(); i++) {
      	var permission = "" + userPermissions.item(i).getTextContent();
      	//log.warn("###### permission: "+ permission);
      	permissions.push(permission);
      }
      
      var canDelete = false;
      if (permissions.includes("samplerbac.data.delete:all")) {
      	canDelete = true;
      } else if (permissions.includes("samplerbac.data.delete:own")) {
      	canDelete = authenticatedUID == uid;
      }
      '
