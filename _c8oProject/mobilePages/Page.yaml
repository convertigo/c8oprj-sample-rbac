          htmlTemplate: |
            '{{''This_sample_project_uses_the_'' | translate}} <code>lib_FullSyncGrp</code> {{''library_to_define_users__groups__roles_a'' | translate}}.<br/>
            {{''This_example_is_based_on_a_dataset_of_si'' | translate}} ({{''see_sequence'' | translate}} <code>GetData</code>).<br/>
            <br/>{{''Permissions_use_the_format'' | translate}} <code>element.action:scope</code> {{''with'' | translate}}
            <table>
            	<tr>
            		<th>{{''T_Key'' | translate}}</th>
            		<th>{{''T_Value'' | translate}}</th>
            		<th>{{''T_Explanation'' | translate}}</th>
            	</tr>
            	<tr>
            		<td>element</td>
            		<td>samplerbac.data</td>
            		<td>{{''to_target_the__data__of_the_sampleRBAC_p'' | translate}}</td>
            	</tr>
            	<tr>
            		<td>action</td>
            		<td>read | write | delete</td>
            		<td>{{''for_presentation_edition_deletion_of__da'' | translate }}</td>
            	</tr>
            	<tr>
            		<td>scope</td>
            		<td>all | own</td>
            		<td></td>
            	</tr>
            </table>
            note: <code>element</code>, <code>action</code> {{''can_take_any_value'' | translate}}
            <br>
            <br>{{''Users_are_divided_into_different_groups_'' | translate}} ({{''see_sequence'' | translate}} <code>InitLoadRolesAndPermissions</code>) :
            <table>
            	<tr>
            		<th>{{''T_User'' | translate}}</th>
            		<th>{{''T_Group'' | translate}}</th>
            		<th>{{''T_Role'' | translate}}</th>
            		<th>{{''T_Permission'' | translate}}</th>
            		<th>{{''T_Explanation'' | translate}}</th>
            	</tr>
            	<tr>
            		<td>admin1</td>
            		<td>full_admins</td>
            		<td>data_admin</td>
            		<td>samplerbac.data.read:all<br/>samplerbac.data.write:all<br/>samplerbac.data.delete:all</td>
            		<td>{{''can_read_view_all_data_on_sampleRBAC'' | translate}}<br/>{{''can_write_modify_all_data_on_sampleRBAC'' | translate}}<br/>{{''can_delete_all_data_on_sampleRBAC'' | translate}}</td>
            	</tr>
            	<tr>
            		<td>admin2</td>
            		<td>restricted_admins</td>
            		<td>data_editor</td>
            		<td>samplerbac.data.read:all<br/>samplerbac.data.write:all</td>
            		<td>{{''can_read_view_all_data_on_sampleRBAC'' | translate}}<br/>{{''can_write_modify_all_data_on_sampleRBAC'' | translate}}</td>
            	</tr>
            	<tr>
            		<td>user1<br/>user2</td>
            		<td>users</td>
            		<td>user_editor</td>
            		<td>samplerbac.data.read:own<br/>samplerbac.data.write:own</td>
            		<td>{{''can_read_view_its_own_data_on_sampleRBAC'' | translate}}<br/>{{''can_write_modify_its_own_data_on_sampleR'' | translate}}</td>
            	</tr>
            	<tr>
            		<td>guest1<br/>guest2</td>
            		<td>guests</td>
            		<td>guest_viewer</td>
            		<td>samplerbac.data.read:own</td>
            		<td>{{''can_read_view_its_own_data_on_sampleRBAC'' | translate}}</td>
            	</tr>
            </table>
            '
